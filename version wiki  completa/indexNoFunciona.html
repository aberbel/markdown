<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Wiki Ejemplo USB</title>
<script src="marked.min.js"></script>
<style>
body{margin:0;font-family:system-ui,sans-serif;display:flex;height:100vh;background:#fff;color:#111;}
#sidebar{width:300px;background:#202124;color:#e8eaed;padding:15px;overflow-y:auto;}
#sidebar h2{font-size:16px;margin-top:0;}
#fileList{list-style:none;padding:0;margin:0;font-size:14px;}
#fileList li{padding:6px 8px;cursor:pointer;border-radius:4px;}
#fileList li:hover{background:#333;}
#fileList li.active{background:#555;}
#content-wrapper{flex:1;display:flex;flex-direction:column;}
#breadcrumbs{padding:10px 40px;font-size:14px;background:#f0f0f0;border-bottom:1px solid #ddd;}
#content{flex:1;padding:20px 40px;overflow-y:auto;}
pre{background:#f0f0f0;padding:10px;border-radius:4px;overflow-x:auto;}
code{background:#eee;padding:2px 4px;border-radius:4px;}
a{color:#1a73e8;}
img{max-width:100%;height:auto;cursor:zoom-in;transition:transform .2s;}
img.zoomed{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(2);z-index:999;cursor:zoom-out;max-width:none;max-height:90%;box-shadow:0 0 20px rgba(0,0,0,.5);}
#top-bar{display:flex;justify-content:space-between;padding:10px 15px;align-items:center;}
#search{width:100%;margin-top:10px;padding:5px;}
button{padding:5px 10px;margin-left:5px;cursor:pointer;}
</style>
</head>
<body data-theme="light">

<div id="sidebar">
  <div id="top-bar">
    <h2>📚 Wiki Ejemplo</h2>
    <button id="toggleTheme">🌙</button>
  </div>
  <input type="text" id="search" placeholder="Buscar…">
  <ul id="fileList"></ul>
</div>

<div id="content-wrapper">
  <div id="breadcrumbs">Wiki</div>
  <div id="content">Selecciona un documento…</div>
</div>

<script>
// Contenido embebido
const pages = {
  "README.md":`# Bienvenido a la Wiki

Esta es la página principal.

![Logo](img/logo.png)

Ir a [Guía de Uso](guia/uso.md)`,

  "guia/uso.md":`# Guía de Uso

Sigue estos pasos para usar la wiki portátil.

![Esquema](img/esquema.svg)

Volver a [Inicio](../README.md)`,

  "guia/instalacion.md":`# Instalación

No se necesita instalar nada. Solo abre el HTML.

Volver a [Guía de Uso](uso.md)`
};

// Imágenes embebidas
const assets = {
  "img/logo.png":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9h...",
  "img/esquema.svg":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0MCIgc3R5bGU9ImZpbGw6I2ZmYzAwMDsiLz48L3N2Zz4="
};

let currentPath=null;
const fileList=document.getElementById('fileList');
const content=document.getElementById('content');
const breadcrumbs=document.getElementById('breadcrumbs');
const searchInput=document.getElementById('search');
const toggleThemeBtn=document.getElementById('toggleTheme');

// Lista de documentos
for(const p in pages){
  const li=document.createElement('li'); li.textContent=p; li.onclick=()=>openFile(p,li); fileList.appendChild(li);
}

// Abrir README.md
if(pages['README.md']) openFile('README.md');

function openFile(path,li=null){
  currentPath=path;
  document.querySelectorAll('#fileList li').forEach(el=>el.classList.remove('active'));
  if(li) li.classList.add('active');
  content.innerHTML=marked.parse(pages[path]);
  wireLinks(); wireImages(); wireBreadcrumbs();
}

function wireLinks(){
  content.querySelectorAll('a').forEach(link=>{
    const href=link.getAttribute('href'); if(!href || href.startsWith('http')) return;
    link.onclick=e=>{e.preventDefault(); const resolved=resolvePath(currentPath,href); if(pages[resolved]) openFile(resolved); else alert('Página no encontrada: '+href);}
  });
}

function wireImages(){
  content.querySelectorAll('img').forEach(img=>{
    const src=img.getAttribute('src'); if(!src || src.startsWith('http')) return;
    const resolved=resolvePath(currentPath,src); if(assets[resolved]) img.src=assets[resolved];
    img.onclick=()=>img.classList.toggle('zoomed');
  });
}

function wireBreadcrumbs(){
  const parts=currentPath.split('/');
  const crumbs=parts.map((name,i)=>{const subpath=parts.slice(0,i+1).join('/'); return '<a href="#" data-path="'+subpath+'">'+name+'</a>';});
  breadcrumbs.innerHTML=crumbs.join(' / ');
  breadcrumbs.querySelectorAll('a').forEach(a=>{a.onclick=e=>{e.preventDefault(); const path=a.getAttribute('data-path'); if(pages[path]) openFile(path);}});
}

function resolvePath(base,relative){
  const stack=base.split('/').slice(0,-1);
  for(const part of relative.split('/')){ if(part==='.'||part==='') continue; if(part==='..') stack.pop(); else stack.push(part);}
  return stack.join('/');
}

// Buscador
searchInput.addEventListener('input',()=>{
  const term=searchInput.value.toLowerCase();
  document.querySelectorAll('#fileList li').forEach(li=>{li.style.display=li.textContent.toLowerCase().includes(term)?'':'none';});
});

// Tema
toggleThemeBtn.addEventListener('click',()=>{
  const theme=document.body.getAttribute('data-theme');
  document.body.setAttribute('data-theme',theme==='light'?'dark':'light');
  toggleThemeBtn.textContent=theme==='light'?'☀️':'🌙';
});
</script>

</body>
</html>
