<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Wiki Portátil PRO</title>
  <script src="marked.min.js"></script>

  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #111;
      --sidebar-bg: #202124;
      --sidebar-text: #e8eaed;
      --link-color: #1a73e8;
      --highlight: #555;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #e8eaed;
      --sidebar-bg: #1e1e1e;
      --sidebar-text: #e8eaed;
      --link-color: #8ab4f8;
      --highlight: #333;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      height: 100vh;
      display: flex;
      background: var(--bg-color);
      color: var(--text-color);
    }

    #sidebar {
      width: 300px;
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      padding: 15px;
      overflow-y: auto;
    }

    #sidebar h2 {
      font-size: 16px;
      margin-top: 0;
    }

    #fileList {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 14px;
    }

    #fileList li {
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 4px;
    }

    #fileList li:hover {
      background: var(--highlight);
    }

    #fileList li.active {
      background: var(--highlight);
    }

    #content-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #breadcrumbs {
      padding: 10px 40px;
      font-size: 14px;
      background: #f0f0f0;
      border-bottom: 1px solid #ddd;
    }

    [data-theme="dark"] #breadcrumbs {
      background: #1c1c1c;
      border-bottom: 1px solid #333;
    }

    #content {
      flex: 1;
      padding: 20px 40px;
      overflow-y: auto;
    }

    pre {
      background: #f0f0f0;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }

    [data-theme="dark"] pre {
      background: #222;
    }

    code {
      background: #eee;
      padding: 2px 4px;
      border-radius: 4px;
    }

    [data-theme="dark"] code {
      background: #333;
    }

    a {
      color: var(--link-color);
    }

    img {
      max-width: 100%;
      height: auto;
      cursor: zoom-in;
      transition: transform 0.2s;
    }

    img.zoomed {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(2);
      z-index: 999;
      cursor: zoom-out;
      max-width: none;
      max-height: 90%;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    #top-bar {
      display: flex;
      justify-content: space-between;
      padding: 10px 15px;
      align-items: center;
    }

    #search {
      width: 100%;
      margin-top: 10px;
      padding: 5px;
    }

    button {
      padding: 5px 10px;
      margin-left: 5px;
      cursor: pointer;
    }

    #controls {
      display: flex;
      gap: 5px;
    }

    #exportBtn {
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 12px;
    }

    #exportBtn:hover {
      background: #1557b0;
    }

    #exportBtn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #pdfOrientation {
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #fff;
    }

    [data-theme="dark"] #pdfOrientation {
      background: #222;
      color: #e8eaed;
      border-color: #333;
    }

    #exportPdfBtn {
      background: #188038;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 12px;
    }

    #exportPdfBtn:hover {
      background: #0f5f28;
    }

    #exportPdfBtn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .highlight {
      background-color: yellow;
      color: black;
      padding: 2px;
      border-radius: 2px;
    }

    [data-theme="dark"] .highlight {
      background-color: #ffd700;
      color: black;
    }

    #pdfModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    #pdfModal.show {
      display: flex;
    }

    #pdfModalContent {
      background: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    #pdfModalContent h3 {
      margin-top: 0;
    }

    #pdfFileList {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 10px;
      margin: 10px 0;
    }

    .pdf-file-item {
      display: flex;
      align-items: center;
      padding: 8px;
      margin: 4px 0;
      background: var(--bg-color);
      border: 1px solid #ddd;
      border-radius: 4px;
      gap: 10px;
    }

    [data-theme="dark"] .pdf-file-item {
      border-color: #444;
    }

    .pdf-file-item input[type="checkbox"] {
      margin: 0;
    }

    .pdf-file-item span {
      flex: 1;
      font-size: 13px;
    }

    .pdf-file-item button {
      padding: 4px 8px;
      font-size: 12px;
      margin: 0 2px;
    }

    #pdfModalButtons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 10px;
    }

    #pdfModalButtons button {
      padding: 8px 16px;
    }
  </style>
</head>
<body data-theme="light">

  <div id="sidebar">
    <div id="top-bar">
      <h2>📚 Wiki PRO</h2>
      <div id="controls">
        <button id="exportBtn" title="Exportar HTML">📥 HTML</button>
        <select id="pdfOrientation" title="Orientacion PDF">
          <option value="portrait" selected>Vertical</option>
          <option value="landscape">Horizontal</option>
        </select>
        <button id="exportPdfBtn" title="Exportar PDF">🧾 PDF</button>
        <button id="toggleTheme">🌙</button>
      </div>
    </div>
    <input type="file" id="folderInput" webkitdirectory multiple>
    <input type="text" id="search" placeholder="Buscar títulos o contenido…">
    <ul id="fileList"></ul>
  </div>

  <div id="content-wrapper">
    <div id="breadcrumbs">Selecciona la carpeta <strong>wiki/</strong></div>
    <div id="content">
      <p>Selecciona la carpeta <strong>wiki/</strong></p>
    </div>
  </div>

  <div id="pdfModal">
    <div id="pdfModalContent">
      <h3>Seleccionar archivos para PDF</h3>
      <div id="pdfFileList"></div>
      <div id="pdfModalButtons">
        <button id="pdfSelectAll">Seleccionar todos</button>
        <button id="pdfCancel">Cancelar</button>
        <button id="pdfConfirm" style="background: #188038; color: white; border: none; border-radius: 4px;">Generar PDF</button>
      </div>
    </div>
  </div>

  <script>
    const folderInput = document.getElementById('folderInput');
    const fileList = document.getElementById('fileList');
    const content = document.getElementById('content');
    const breadcrumbs = document.getElementById('breadcrumbs');
    const searchInput = document.getElementById('search');
    const toggleThemeBtn = document.getElementById('toggleTheme');
    const exportBtn = document.getElementById('exportBtn');
    const exportPdfBtn = document.getElementById('exportPdfBtn');
    const pdfOrientationSelect = document.getElementById('pdfOrientation');
    const pdfModal = document.getElementById('pdfModal');
    const pdfFileList = document.getElementById('pdfFileList');
    const pdfSelectAll = document.getElementById('pdfSelectAll');
    const pdfCancel = document.getElementById('pdfCancel');
    const pdfConfirm = document.getElementById('pdfConfirm');

    let pdfOrderedFiles = [];

    let files = {};     // .md
    let allFiles = {};  // todos los archivos
    let currentPath = null;
    let lastSearchTerm = '';

    // Cambiar tema
    toggleThemeBtn.addEventListener('click', () => {
      const theme = document.body.getAttribute('data-theme');
      document.body.setAttribute('data-theme', theme === 'light' ? 'dark' : 'light');
      toggleThemeBtn.textContent = theme === 'light' ? '☀️' : '🌙';
    });

    // Exportar HTML
    exportBtn.addEventListener('click', async () => {
      if (Object.keys(files).length === 0) {
        alert('Carga una carpeta wiki primero');
        return;
      }

      exportBtn.disabled = true;
      exportBtn.textContent = '⏳ Exportando...';

      try {
        // Intentar usar File System Access API
        if ('showDirectoryPicker' in window) {
          const dirHandle = await window.showDirectoryPicker();
          let count = 0;

          // Procesar todos los archivos .md
          for (const path in files) {
            const mdFile = files[path];
            const relativePath = path.replace(/^.*?wiki\//, '');
            const htmlPath = relativePath.replace(/\.md$/, '.html');

            const reader = new FileReader();
            const markdownContent = await new Promise((resolve) => {
              reader.onload = () => resolve(reader.result);
              reader.readAsText(mdFile);
            });

            // Convertir markdown a HTML
            let htmlContent = marked.parse(markdownContent);
            
            // Actualizar enlaces .md a .html
            htmlContent = htmlContent.replace(/href="([^"]+)\.md"/g, 'href="$1.html"');
            htmlContent = htmlContent.replace(/href="\.\.?\/([^"]+)\.md"/g, (match, p1) => {
              return `href="${p1}.html"`;
            });

            const fullHtml = `<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${relativePath.replace('.md', '')}</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
      color: #333;
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }
    pre {
      background: #f4f4f4;
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
      border-left: 3px solid #1a73e8;
    }
    code {
      background: #f4f4f4;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
    }
    pre code {
      background: none;
      padding: 0;
    }
    a {
      color: #1a73e8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    h1, h2, h3 {
      margin-top: 1.5em;
      color: #202124;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background: #f4f4f4;
    }
  </style>
</head>
<body>
${htmlContent}
</body>
</html>`;

            // Crear subdirectorios si es necesario
            const parts = htmlPath.split('/');
            let currentDir = dirHandle;
            for (let i = 0; i < parts.length - 1; i++) {
              currentDir = await currentDir.getDirectoryHandle(parts[i], { create: true });
            }

            const fileHandle = await currentDir.getFileHandle(parts[parts.length - 1], { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(fullHtml);
            await writable.close();
            count++;
          }

          // Incluir imágenes y otros recursos
          for (const path in allFiles) {
            const file = allFiles[path];
            if (!path.endsWith('.md')) {
              const relativePath = path.replace(/^.*?wiki\//, '');
              const parts = relativePath.split('/');
              let currentDir = dirHandle;
              for (let i = 0; i < parts.length - 1; i++) {
                currentDir = await currentDir.getDirectoryHandle(parts[i], { create: true });
              }

              const fileHandle = await currentDir.getFileHandle(parts[parts.length - 1], { create: true });
              const writable = await fileHandle.createWritable();
              await writable.write(file);
              await writable.close();
            }
          }

          alert(`✅ Exportación completa: ${count} documentos HTML guardados en la carpeta seleccionada`);
        } else {
          alert('❌ Tu navegador no soporta la exportación de carpetas. Usa Chrome o Edge.');
        }
      } catch (error) {
        if (error.name === 'AbortError') {
          // Usuario canceló
        } else {
          alert('Error al exportar: ' + error.message);
        }
      } finally {
        exportBtn.disabled = false;
        exportBtn.textContent = '📥 HTML';
      }
    });

    // Mostrar modal de selección de archivos
    exportPdfBtn.addEventListener('click', () => {
      if (Object.keys(files).length === 0) {
        alert('Carga una carpeta wiki primero');
        return;
      }

      showPdfModal();
    });

    function showPdfModal() {
      pdfOrderedFiles = Object.keys(files).sort();
      renderPdfFileList();
      pdfModal.classList.add('show');
    }

    function renderPdfFileList() {
      pdfFileList.innerHTML = '';
      pdfOrderedFiles.forEach((path, index) => {
        const div = document.createElement('div');
        div.className = 'pdf-file-item';
        div.innerHTML = `
          <input type="checkbox" checked data-path="${path}">
          <span>${path.replace(/^.*?wiki\//, '')}</span>
          <button onclick="movePdfFile(${index}, -1)" ${index === 0 ? 'disabled' : ''}>↑</button>
          <button onclick="movePdfFile(${index}, 1)" ${index === pdfOrderedFiles.length - 1 ? 'disabled' : ''}>↓</button>
        `;
        pdfFileList.appendChild(div);
      });
    }

    window.movePdfFile = function(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= pdfOrderedFiles.length) return;
      [pdfOrderedFiles[index], pdfOrderedFiles[newIndex]] = [pdfOrderedFiles[newIndex], pdfOrderedFiles[index]];
      renderPdfFileList();
    };

    pdfSelectAll.addEventListener('click', () => {
      const checkboxes = pdfFileList.querySelectorAll('input[type="checkbox"]');
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);
      checkboxes.forEach(cb => cb.checked = !allChecked);
      pdfSelectAll.textContent = allChecked ? 'Seleccionar todos' : 'Deseleccionar todos';
    });

    pdfCancel.addEventListener('click', () => {
      pdfModal.classList.remove('show');
    });

    pdfConfirm.addEventListener('click', async () => {
      pdfModal.classList.remove('show');
      await generatePdf();
    });

    // Exportar PDF (documentos seleccionados)
    async function generatePdf() {
      exportPdfBtn.disabled = true;
      exportPdfBtn.textContent = '⏳ PDF...';

      try {
        const orientation = pdfOrientationSelect.value || 'portrait';
        const selectedPaths = Array.from(pdfFileList.querySelectorAll('input[type="checkbox"]:checked'))
          .map(cb => cb.getAttribute('data-path'));
        
        if (selectedPaths.length === 0) {
          alert('Selecciona al menos un documento');
          exportPdfBtn.disabled = false;
          exportPdfBtn.textContent = '🧾PDF';
          return;
        }

        const sections = [];

        function readFileAsText(file) {
          return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.readAsText(file);
          });
        }

        for (const path of selectedPaths) {
          const markdownContent = await readFileAsText(files[path]);
          let htmlContent = marked.parse(markdownContent);
          
          // Convertir imágenes a data URIs
          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlContent, 'text/html');
          
          const imgPromises = Array.from(doc.querySelectorAll('img')).map(async img => {
            const src = img.getAttribute('src');
            if (!src || src.startsWith('http') || src.startsWith('data:')) return;
            const resolved = resolvePath(path, src);
            const file = allFiles[resolved];
            if (file) {
              // Para SVGs, insertarlos inline en lugar de como <img>
              if (file.type === 'image/svg+xml' || file.name.endsWith('.svg')) {
                try {
                  const svgText = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.readAsText(file);
                  });
                  
                  // Crear un elemento temporal para parsear el SVG
                  const tempDiv = document.createElement('div');
                  tempDiv.innerHTML = svgText.trim();
                  const svgElement = tempDiv.querySelector('svg');
                  
                  if (svgElement) {
                    // Asegurar que el SVG tenga dimensiones
                    if (!svgElement.hasAttribute('width')) svgElement.setAttribute('width', '100%');
                    if (!svgElement.hasAttribute('height')) svgElement.setAttribute('height', 'auto');
                    svgElement.style.maxWidth = '100%';
                    svgElement.style.height = 'auto';
                    
                    // Reemplazar el <img> con el <svg> inline
                    img.parentNode.replaceChild(svgElement, img);
                  }
                } catch (e) {
                  console.error('Error procesando SVG:', e);
                }
              } else {
                // Para otras imágenes, usar data URI normal
                const dataUrl = await new Promise((resolve) => {
                  const reader = new FileReader();
                  reader.onload = () => resolve(reader.result);
                  reader.readAsDataURL(file);
                });
                img.setAttribute('src', dataUrl);
              }
            }
          });
          
          await Promise.all(imgPromises);
          
          htmlContent = doc.body.innerHTML;
          const title = path.replace(/^.*?wiki\//, '').replace(/\.md$/, '');
          sections.push(`<article>
<h1>${title}</h1>
${htmlContent}
</article>`);
        }

        const printWindow = window.open('', '_blank');
        if (!printWindow) {
          alert('Tu navegador bloqueó la ventana de impresión');
          return;
        }

        printWindow.document.open();
        printWindow.document.write(`<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki PDF</title>
  <style>
    @page {
      size: A4 ${orientation};
      margin: 15mm 15mm 20mm 15mm;
    }
    @page {
      @bottom-center {
        content: counter(page) " / " counter(pages);
        font-size: 10pt;
        color: #666;
      }
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 100%;
      margin: 0;
      padding: 10mm;
      line-height: 1.6;
      color: #333;
      font-size: 11pt;
    }
    article {
      page-break-before: always;
    }
    article:first-of-type {
      page-break-before: auto;
    }
    img, svg {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      display: block;
    }
    img[src$=".svg"], img[src*="svg"], svg {
      width: 100%;
      height: auto;
    }
    pre {
      background: #f4f4f4;
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
      border-left: 3px solid #1a73e8;
      page-break-inside: avoid;
    }
    code {
      background: #f4f4f4;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
    }
    pre code {
      background: none;
      padding: 0;
    }
    a {
      color: #1a73e8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    h1, h2, h3 {
      margin-top: 1.5em;
      color: #202124;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background: #f4f4f4;
    }
    @media print {
      body {
        max-width: none;
      }
      a {
        color: #000;
        text-decoration: none;
      }
      img, svg {
        max-width: 100%;
        page-break-inside: avoid;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  ${sections.join('\n')}
</body>
</html>`);
        printWindow.document.close();
        printWindow.focus();
        printWindow.print();
      } catch (error) {
        alert('Error al exportar PDF: ' + error.message);
      } finally {
        exportPdfBtn.disabled = false;
        exportPdfBtn.textContent = '🧾 PDF';
      }
    }

    folderInput.addEventListener('change', () => {
      files = {};
      allFiles = {};
      fileList.innerHTML = '';
      searchInput.value = '';
      content.innerHTML = '<p>Selecciona un documento…</p>';
      breadcrumbs.textContent = '';

      Array.from(folderInput.files).forEach(file => {
        allFiles[file.webkitRelativePath] = file;
        if (file.name.endsWith('.md')) files[file.webkitRelativePath] = file;
      });

      for (const path in files) {
        const li = document.createElement('li');
        li.textContent = path.replace(/^.*?wiki\//, '');
        li.onclick = () => openFile(path, li);
        fileList.appendChild(li);
      }

      // Abrir README.md por defecto
      const readme = Object.keys(files).find(p => p.endsWith('README.md'));
      if (readme) openFile(readme);
    });

    function openFile(path, li = null) {
      currentPath = path;
      document.querySelectorAll('#fileList li').forEach(el => el.classList.remove('active'));
      if (li) li.classList.add('active');

      const reader = new FileReader();
      reader.onload = () => {
        content.innerHTML = marked.parse(reader.result);
        wireLinks();
        wireImages();
        wireBreadcrumbs();
        
        // Resaltar término de búsqueda en el contenido
        if (lastSearchTerm) {
          highlightInContent(lastSearchTerm);
        }
      };
      reader.readAsText(files[path]);
    }

    // Breadcrumbs
    function wireBreadcrumbs() {
      const parts = currentPath.split('/');
      let crumbs = [];
      for (let i = 0; i < parts.length; i++) {
        const name = parts[i];
        const subpath = parts.slice(0, i + 1).join('/');
        crumbs.push(`<a href="#" data-path="${subpath}">${name}</a>`);
      }
      breadcrumbs.innerHTML = crumbs.join(' / ');
      breadcrumbs.querySelectorAll('a').forEach(a => {
        a.onclick = e => {
          e.preventDefault();
          const path = a.getAttribute('data-path');
          if (files[path]) openFile(path);
        };
      });
    }

    // Enlaces internos .md
    function wireLinks() {
      content.querySelectorAll('a').forEach(link => {
        const href = link.getAttribute('href');
        if (!href || href.startsWith('http')) return;
        link.onclick = e => {
          e.preventDefault();
          const resolved = resolvePath(currentPath, href);
          if (files[resolved]) openFile(resolved);
          else alert('Página no encontrada: ' + href);
        };
      });
    }

    // Imágenes locales
    function wireImages() {
      content.querySelectorAll('img').forEach(img => {
        const src = img.getAttribute('src');
        if (!src || src.startsWith('http')) return;
        const resolved = resolvePath(currentPath, src);
        const file = allFiles[resolved];
        if (file) {
          img.src = URL.createObjectURL(file);
          img.onclick = () => img.classList.toggle('zoomed');
        } else {
          img.alt += ' (imagen no encontrada)';
        }
      });
    }

    // Resolver rutas relativas ./ ../
    function resolvePath(base, relative) {
      const stack = base.split('/').slice(0, -1);
      for (const part of relative.split('/')) {
        if (part === '.' || part === '') continue;
        if (part === '..') stack.pop();
        else stack.push(part);
      }
      return stack.join('/');
    }

    // Buscador de contenido
    let searchTimeout;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      const term = searchInput.value.trim();
      
      if (!term) {
        // Sin búsqueda: mostrar lista normal
        fileList.innerHTML = '';
        for (const path in files) {
          const li = document.createElement('li');
          li.textContent = path.replace(/^.*?wiki\//, '');
          li.onclick = () => openFile(path, li);
          fileList.appendChild(li);
        }
        return;
      }

      searchTimeout = setTimeout(() => {
        searchContent(term);
      }, 300);
    });

    function searchContent(term) {
      const termLower = term.toLowerCase();
      const results = [];
      
      Object.keys(files).forEach(path => {
        const reader = new FileReader();
        reader.onload = () => {
          const content = reader.result.toLowerCase();
          const fileName = path.replace(/^.*?wiki\//, '');
          
          if (fileName.toLowerCase().includes(termLower) || content.includes(termLower)) {
            // Extraer contexto
            const index = content.indexOf(termLower);
            let snippet = '';
            if (index !== -1) {
              const start = Math.max(0, index - 40);
              const end = Math.min(content.length, index + termLower.length + 40);
              snippet = '...' + reader.result.substring(start, end).replace(/\n/g, ' ') + '...';
            }
            
            results.push({ path, fileName, snippet });
          }
          
          // Actualizar después de leer todos los archivos
          if (results.length > 0 || Object.keys(files).every(p => {
            const f = files[p];
            return f._searched;
          })) {
            displaySearchResults(results, termLower);
          }
        };
        reader.readAsText(files[path]);
        files[path]._searched = true;
      });
    }

    function displaySearchResults(results, term) {
      fileList.innerHTML = '';
      lastSearchTerm = term;
      
      if (results.length === 0) {
        fileList.innerHTML = '<li style="color: #888; cursor: default;">No se encontraron resultados</li>';
        return;
      }
      
      results.forEach(({ path, fileName, snippet }) => {
        const li = document.createElement('li');
        const highlightedFileName = highlightText(fileName, term);
        li.innerHTML = `<strong>${highlightedFileName}</strong>`;
        if (snippet) {
          const highlightedSnippet = highlightText(snippet, term);
          li.innerHTML += `<br><small style="color: #aaa;">${highlightedSnippet}</small>`;
        }
        li.onclick = () => openFile(path, li);
        li.style.whiteSpace = 'normal';
        li.style.wordWrap = 'break-word';
        fileList.appendChild(li);
      });
      
      // Limpiar marcador de búsqueda
      Object.keys(files).forEach(p => delete files[p]._searched);
    }

    function highlightText(text, term) {
      const regex = new RegExp(`(${term})`, 'gi');
      return text.replace(regex, '<span class="highlight">$1</span>');
    }

    function highlightInContent(term) {
      const walker = document.createTreeWalker(
        content,
        NodeFilter.SHOW_TEXT,
        null,
        false
      );
      
      const nodesToReplace = [];
      let node;
      
      while (node = walker.nextNode()) {
        if (node.nodeValue.toLowerCase().includes(term.toLowerCase())) {
          nodesToReplace.push(node);
        }
      }
      
      nodesToReplace.forEach(node => {
        const span = document.createElement('span');
        span.innerHTML = highlightText(node.nodeValue, term);
        node.parentNode.replaceChild(span, node);
      });
    }

  </script>
</body>
