<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Wiki Portátil PRO</title>
  <script src="marked.min.js"></script>

  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #111;
      --sidebar-bg: #202124;
      --sidebar-text: #e8eaed;
      --link-color: #1a73e8;
      --highlight: #555;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #e8eaed;
      --sidebar-bg: #1e1e1e;
      --sidebar-text: #e8eaed;
      --link-color: #8ab4f8;
      --highlight: #333;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      height: 100vh;
      display: flex;
      background: var(--bg-color);
      color: var(--text-color);
    }

    #sidebar {
      width: 300px;
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      padding: 15px;
      overflow-y: auto;
    }

    #sidebar h2 {
      font-size: 16px;
      margin-top: 0;
    }

    #fileList {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 14px;
    }

    #fileList li {
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 4px;
    }

    #fileList li:hover {
      background: var(--highlight);
    }

    #fileList li.active {
      background: var(--highlight);
    }

    #content-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #breadcrumbs {
      padding: 10px 40px;
      font-size: 14px;
      background: #f0f0f0;
      border-bottom: 1px solid #ddd;
    }

    [data-theme="dark"] #breadcrumbs {
      background: #1c1c1c;
      border-bottom: 1px solid #333;
    }

    #content {
      flex: 1;
      padding: 20px 40px;
      overflow-y: auto;
    }

    pre {
      background: #f0f0f0;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }

    [data-theme="dark"] pre {
      background: #222;
    }

    code {
      background: #eee;
      padding: 2px 4px;
      border-radius: 4px;
    }

    [data-theme="dark"] code {
      background: #333;
    }

    a {
      color: var(--link-color);
    }

    img {
      max-width: 100%;
      height: auto;
      cursor: zoom-in;
      transition: transform 0.2s;
    }

    img.zoomed {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(2);
      z-index: 999;
      cursor: zoom-out;
      max-width: none;
      max-height: 90%;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    #top-bar {
      display: flex;
      justify-content: space-between;
      padding: 10px 15px;
      align-items: center;
    }

    #search {
      width: 100%;
      margin-top: 10px;
      padding: 5px;
    }

    button {
      padding: 5px 10px;
      margin-left: 5px;
      cursor: pointer;
    }

    .highlight {
      background-color: yellow;
      color: black;
      padding: 2px;
      border-radius: 2px;
    }

    [data-theme="dark"] .highlight {
      background-color: #ffd700;
      color: black;
    }
  </style>
</head>
<body data-theme="light">

  <div id="sidebar">
    <div id="top-bar">
      <h2>📚 Wiki PRO</h2>
      <button id="toggleTheme">🌙</button>
    </div>
    <input type="file" id="folderInput" webkitdirectory multiple>
    <input type="text" id="search" placeholder="Buscar títulos o contenido…">
    <ul id="fileList"></ul>
  </div>

  <div id="content-wrapper">
    <div id="breadcrumbs">Selecciona la carpeta <strong>wiki/</strong></div>
    <div id="content">
      <p>Selecciona la carpeta <strong>wiki/</strong></p>
    </div>
  </div>

  <script>
    const folderInput = document.getElementById('folderInput');
    const fileList = document.getElementById('fileList');
    const content = document.getElementById('content');
    const breadcrumbs = document.getElementById('breadcrumbs');
    const searchInput = document.getElementById('search');
    const toggleThemeBtn = document.getElementById('toggleTheme');

    let files = {};     // .md
    let allFiles = {};  // todos los archivos
    let currentPath = null;
    let lastSearchTerm = '';

    // Cambiar tema
    toggleThemeBtn.addEventListener('click', () => {
      const theme = document.body.getAttribute('data-theme');
      document.body.setAttribute('data-theme', theme === 'light' ? 'dark' : 'light');
      toggleThemeBtn.textContent = theme === 'light' ? '☀️' : '🌙';
    });

    folderInput.addEventListener('change', () => {
      files = {};
      allFiles = {};
      fileList.innerHTML = '';
      searchInput.value = '';
      content.innerHTML = '<p>Selecciona un documento…</p>';
      breadcrumbs.textContent = '';

      Array.from(folderInput.files).forEach(file => {
        allFiles[file.webkitRelativePath] = file;
        if (file.name.endsWith('.md')) files[file.webkitRelativePath] = file;
      });

      for (const path in files) {
        const li = document.createElement('li');
        li.textContent = path.replace(/^.*?wiki\//, '');
        li.onclick = () => openFile(path, li);
        fileList.appendChild(li);
      }

      // Abrir README.md por defecto
      const readme = Object.keys(files).find(p => p.endsWith('README.md'));
      if (readme) openFile(readme);
    });

    function openFile(path, li = null) {
      currentPath = path;
      document.querySelectorAll('#fileList li').forEach(el => el.classList.remove('active'));
      if (li) li.classList.add('active');

      const reader = new FileReader();
      reader.onload = () => {
        content.innerHTML = marked.parse(reader.result);
        wireLinks();
        wireImages();
        wireBreadcrumbs();
        
        // Resaltar término de búsqueda en el contenido
        if (lastSearchTerm) {
          highlightInContent(lastSearchTerm);
        }
      };
      reader.readAsText(files[path]);
    }

    // Breadcrumbs
    function wireBreadcrumbs() {
      const parts = currentPath.split('/');
      let crumbs = [];
      for (let i = 0; i < parts.length; i++) {
        const name = parts[i];
        const subpath = parts.slice(0, i + 1).join('/');
        crumbs.push(`<a href="#" data-path="${subpath}">${name}</a>`);
      }
      breadcrumbs.innerHTML = crumbs.join(' / ');
      breadcrumbs.querySelectorAll('a').forEach(a => {
        a.onclick = e => {
          e.preventDefault();
          const path = a.getAttribute('data-path');
          if (files[path]) openFile(path);
        };
      });
    }

    // Enlaces internos .md
    function wireLinks() {
      content.querySelectorAll('a').forEach(link => {
        const href = link.getAttribute('href');
        if (!href || href.startsWith('http')) return;
        link.onclick = e => {
          e.preventDefault();
          const resolved = resolvePath(currentPath, href);
          if (files[resolved]) openFile(resolved);
          else alert('Página no encontrada: ' + href);
        };
      });
    }

    // Imágenes locales
    function wireImages() {
      content.querySelectorAll('img').forEach(img => {
        const src = img.getAttribute('src');
        if (!src || src.startsWith('http')) return;
        const resolved = resolvePath(currentPath, src);
        const file = allFiles[resolved];
        if (file) {
          img.src = URL.createObjectURL(file);
          img.onclick = () => img.classList.toggle('zoomed');
        } else {
          img.alt += ' (imagen no encontrada)';
        }
      });
    }

    // Resolver rutas relativas ./ ../
    function resolvePath(base, relative) {
      const stack = base.split('/').slice(0, -1);
      for (const part of relative.split('/')) {
        if (part === '.' || part === '') continue;
        if (part === '..') stack.pop();
        else stack.push(part);
      }
      return stack.join('/');
    }

    // Buscador de contenido
    let searchTimeout;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      const term = searchInput.value.trim();
      
      if (!term) {
        // Sin búsqueda: mostrar lista normal
        fileList.innerHTML = '';
        for (const path in files) {
          const li = document.createElement('li');
          li.textContent = path.replace(/^.*?wiki\//, '');
          li.onclick = () => openFile(path, li);
          fileList.appendChild(li);
        }
        return;
      }

      searchTimeout = setTimeout(() => {
        searchContent(term);
      }, 300);
    });

    function searchContent(term) {
      const termLower = term.toLowerCase();
      const results = [];
      
      Object.keys(files).forEach(path => {
        const reader = new FileReader();
        reader.onload = () => {
          const content = reader.result.toLowerCase();
          const fileName = path.replace(/^.*?wiki\//, '');
          
          if (fileName.toLowerCase().includes(termLower) || content.includes(termLower)) {
            // Extraer contexto
            const index = content.indexOf(termLower);
            let snippet = '';
            if (index !== -1) {
              const start = Math.max(0, index - 40);
              const end = Math.min(content.length, index + termLower.length + 40);
              snippet = '...' + reader.result.substring(start, end).replace(/\n/g, ' ') + '...';
            }
            
            results.push({ path, fileName, snippet });
          }
          
          // Actualizar después de leer todos los archivos
          if (results.length > 0 || Object.keys(files).every(p => {
            const f = files[p];
            return f._searched;
          })) {
            displaySearchResults(results, termLower);
          }
        };
        reader.readAsText(files[path]);
        files[path]._searched = true;
      });
    }

    function displaySearchResults(results, term) {
      fileList.innerHTML = '';
      lastSearchTerm = term;
      
      if (results.length === 0) {
        fileList.innerHTML = '<li style="color: #888; cursor: default;">No se encontraron resultados</li>';
        return;
      }
      
      results.forEach(({ path, fileName, snippet }) => {
        const li = document.createElement('li');
        const highlightedFileName = highlightText(fileName, term);
        li.innerHTML = `<strong>${highlightedFileName}</strong>`;
        if (snippet) {
          const highlightedSnippet = highlightText(snippet, term);
          li.innerHTML += `<br><small style="color: #aaa;">${highlightedSnippet}</small>`;
        }
        li.onclick = () => openFile(path, li);
        li.style.whiteSpace = 'normal';
        li.style.wordWrap = 'break-word';
        fileList.appendChild(li);
      });
      
      // Limpiar marcador de búsqueda
      Object.keys(files).forEach(p => delete files[p]._searched);
    }

    function highlightText(text, term) {
      const regex = new RegExp(`(${term})`, 'gi');
      return text.replace(regex, '<span class="highlight">$1</span>');
    }

    function highlightInContent(term) {
      const walker = document.createTreeWalker(
        content,
        NodeFilter.SHOW_TEXT,
        null,
        false
      );
      
      const nodesToReplace = [];
      let node;
      
      while (node = walker.nextNode()) {
        if (node.nodeValue.toLowerCase().includes(term.toLowerCase())) {
          nodesToReplace.push(node);
        }
      }
      
      nodesToReplace.forEach(node => {
        const span = document.createElement('span');
        span.innerHTML = highlightText(node.nodeValue, term);
        node.parentNode.replaceChild(span, node);
      });
    }

  </script>
</body>
</html>
