<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki Portátil PRO</title>
  <script src="marked.min.js"></script>
  <link href="bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #111;
      --sidebar-bg: #202124;
      --sidebar-text: #e8eaed;
      --link-color: #1a73e8;
      --highlight: #555;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #e8eaed;
      --sidebar-bg: #1e1e1e;
      --sidebar-text: #e8eaed;
      --link-color: #8ab4f8;
      --highlight: #333;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.2s, color 0.2s;
    }

    .wiki-container {
      display: flex;
      height: 100vh;
      gap: 0;
    }

    #sidebar {
      width: 300px;
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      padding: 15px;
      overflow-y: auto;
      flex-shrink: 0;
      border-right: 1px solid var(--highlight);
      display: flex;
      flex-direction: column;
    }

    #sidebar h2 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: var(--sidebar-text);
    }

    #folderBtn {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }

    #folderBtn:hover {
      background: #1557b0;
    }

    #search {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid var(--highlight);
      border-radius: 4px;
      background: var(--bg-color);
      color: var(--text-color);
    }

    #fileList {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 14px;
      flex: 1;
      overflow-y: auto;
      border-radius: 4px;
    }

    #fileList li {
      padding: 8px 10px;
      cursor: pointer;
      border-radius: 4px;
      margin-bottom: 2px;
      word-break: break-word;
    }

    #fileList li:hover {
      background: var(--highlight);
    }

    #fileList li.active {
      background: var(--link-color);
      color: white;
    }

    #content-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    #breadcrumbs {
      padding: 10px 20px;
      font-size: 13px;
      background: #f0f0f0;
      border-bottom: 1px solid #ddd;
      overflow-x: auto;
      white-space: nowrap;
    }

    [data-theme="dark"] #breadcrumbs {
      background: #1c1c1c;
      border-bottom-color: #333;
    }

    #breadcrumbs a {
      color: var(--link-color);
      text-decoration: none;
      cursor: pointer;
    }

    #breadcrumbs a:hover {
      text-decoration: underline;
    }

    #content {
      flex: 1;
      padding: 20px 30px;
      overflow-y: auto;
      overflow-x: hidden;
      word-wrap: break-word;
    }

    #content p {
      margin: 0 0 1em 0;
    }

    #content h1, #content h2, #content h3, #content h4, #content h5, #content h6 {
      margin-top: 1.5em;
      margin-bottom: 0.5em;
    }

    #content h1 {
      font-size: 2em;
      border-bottom: 2px solid var(--link-color);
      padding-bottom: 0.3em;
    }

    pre {
      background: #f0f0f0;
      padding: 12px;
      border-radius: 4px;
      overflow-x: auto;
      border-left: 3px solid var(--link-color);
      margin: 1em 0;
    }

    [data-theme="dark"] pre {
      background: #222;
    }

    code {
      background: #eee;
      padding: 2px 4px;
      border-radius: 4px;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 0.9em;
    }

    [data-theme="dark"] code {
      background: #333;
    }

    pre code {
      background: none;
      padding: 0;
    }

    a {
      color: var(--link-color);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    img {
      max-width: 100%;
      height: auto;
      cursor: zoom-in;
      transition: transform 0.2s;
      display: block;
      border-radius: 4px;
      margin: 1em 0;
    }

    img.zoomed {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(2);
      z-index: 999;
      cursor: zoom-out;
      max-width: none;
      max-height: 90%;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      border-radius: 8px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
      background: var(--bg-color);
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px 12px;
      text-align: left;
    }

    [data-theme="dark"] th,
    [data-theme="dark"] td {
      border-color: #444;
    }

    th {
      background: #f4f4f4;
      font-weight: bold;
    }

    [data-theme="dark"] th {
      background: #222;
    }

    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      transition: background-color 0.2s;
      white-space: nowrap;
    }

    #exportBtn {
      background: #1a73e8;
      color: white;
    }

    #exportBtn:hover {
      background: #1557b0;
    }

    #exportBtn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #exportPdfBtn {
      background: #188038;
      color: white;
    }

    #exportPdfBtn:hover {
      background: #0f5f28;
    }

    #exportPdfBtn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #pdfOrientation {
      padding: 6px 10px;
      border: 1px solid var(--highlight);
      border-radius: 4px;
      background: var(--bg-color);
      color: var(--text-color);
      font-size: 13px;
    }

    #toggleTheme {
      background: var(--highlight);
      color: var(--sidebar-text);
      padding: 6px 10px;
    }

    #toggleTheme:hover {
      background: #666;
    }

    #editBtnHeader {
      background: #1a73e8;
      color: white;
    }

    #editBtnHeader:hover {
      background: #1557b0;
    }

    .highlight {
      background-color: yellow;
      color: black;
      padding: 2px 4px;
      border-radius: 2px;
    }

    [data-theme="dark"] .highlight {
      background-color: #ffd700;
      color: black;
    }

    #pdfModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #pdfModal.show {
      display: flex;
    }

    #pdfModalContent {
      background: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      width: 100%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    #pdfModalContent h3 {
      margin-top: 0;
      margin-bottom: 15px;
    }

    #pdfFileList {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--highlight);
      border-radius: 4px;
      padding: 10px;
      margin: 10px 0;
    }

    .pdf-file-item {
      display: flex;
      align-items: center;
      padding: 8px;
      margin: 4px 0;
      background: var(--bg-color);
      border: 1px solid var(--highlight);
      border-radius: 4px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pdf-file-item input[type="checkbox"] {
      margin: 0;
    }

    .pdf-file-item span {
      flex: 1;
      font-size: 13px;
      min-width: 150px;
    }

    .pdf-file-item button {
      padding: 4px 8px;
      font-size: 12px;
      margin: 0 2px;
      background: #1a73e8;
      color: white;
    }

    .pdf-file-item button:hover {
      background: #1557b0;
    }

    .pdf-file-item button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #pdfModalButtons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    #pdfModalButtons button {
      padding: 8px 16px;
    }

    #pdfSelectAll, #pdfCancel {
      background: #5f6368;
      color: white;
    }

    #pdfSelectAll:hover, #pdfCancel:hover {
      background: #3c4043;
    }

    #pdfConfirm {
      background: #188038;
      color: white;
    }

    #pdfConfirm:hover {
      background: #0f5f28;
    }

    #editor-container {
      display: none;
      flex-direction: column;
      flex: 1;
      gap: 0;
      overflow: hidden;
    }

    #editor-container.active {
      display: flex;
    }

    #content.edit-mode {
      display: none;
    }

    #editor-toolbar {
      display: flex;
      gap: 10px;
      padding: 12px 20px;
      background: #f8f8f8;
      border-bottom: 1px solid #ddd;
      align-items: center;
      flex-wrap: wrap;
    }

    [data-theme="dark"] #editor-toolbar {
      background: #1c1c1c;
      border-bottom-color: #333;
    }

    .view-btn, .save-btn, .cancel-btn, .edit-btn {
      background: #1a73e8;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
    }

    .save-btn {
      background: #188038;
    }

    .save-btn:hover {
      background: #0f5f28;
    }

    .save-btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .cancel-btn {
      background: #5f6368;
    }

    .cancel-btn:hover {
      background: #3c4043;
    }

    .view-btn:hover, .edit-btn:hover {
      background: #1557b0;
    }

    #edit-status {
      margin-left: auto;
      font-size: 12px;
    }

    #editor-textarea {
      flex: 1;
      padding: 16px 20px;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 14px;
      line-height: 1.6;
      resize: none;
      border: none;
      background: var(--bg-color);
      color: var(--text-color);
      outline: none;
      overflow-y: auto;
      overflow-x: auto;
      word-wrap: break-word;
    }

    #editor-textarea::placeholder {
      color: #999;
    }

    .file-modified::before {
      content: '● ';
      color: #ff6b6b;
      margin-right: 5px;
    }

    /* Responsive design para tablets y móviles */
    @media (max-width: 768px) {
      .wiki-container {
        flex-direction: column;
      }

      #sidebar {
        width: 100%;
        max-height: 40vh;
        border-right: none;
        border-bottom: 1px solid var(--highlight);
        order: -1;
      }

      #sidebar h2 {
        font-size: 16px;
        margin-bottom: 10px;
      }

      #top-bar {
        flex-direction: column;
        align-items: stretch;
      }

      #top-bar h2 {
        margin: 0;
      }

      #controls {
        width: 100%;
      }

      #folderBtn {
        margin-bottom: 8px;
      }

      #search {
        margin-bottom: 8px;
      }

      #fileList {
        max-height: 150px;
      }

      #content-wrapper {
        flex: 1;
        min-height: 0;
      }

      #content {
        padding: 15px 20px;
        font-size: 14px;
      }

      #breadcrumbs {
        padding: 8px 15px;
        font-size: 12px;
      }

      #editor-toolbar {
        padding: 10px 15px;
        gap: 8px;
      }

      button {
        padding: 6px 10px;
        font-size: 12px;
      }

      #pdfModalContent {
        max-width: 90%;
        max-height: 70vh;
        padding: 15px;
      }

      #editor-textarea {
        padding: 12px 15px;
        font-size: 13px;
      }

      #content h1 {
        font-size: 1.5em;
      }

      img {
        margin: 0.5em 0;
      }
    }

    /* Responsive design para móviles pequeños */
    @media (max-width: 480px) {
      #sidebar {
        max-height: 35vh;
      }

      #fileList {
        max-height: 100px;
        font-size: 12px;
      }

      #fileList li {
        padding: 6px 8px;
      }

      #content {
        padding: 12px 15px;
        font-size: 13px;
      }

      #breadcrumbs {
        padding: 6px 10px;
        font-size: 11px;
      }

      #top-bar h2 {
        font-size: 14px;
      }

      button {
        padding: 6px 8px;
        font-size: 11px;
      }

      #controls {
        gap: 4px;
      }

      #exportBtn, #exportPdfBtn {
        flex: 1;
        min-width: 60px;
      }

      #pdfOrientation {
        padding: 4px 6px;
        font-size: 11px;
      }

      #toggleTheme {
        padding: 6px;
      }

      #editor-toolbar {
        padding: 8px 10px;
        gap: 6px;
      }

      .view-btn, .save-btn, .cancel-btn, .edit-btn {
        padding: 6px 8px;
        font-size: 11px;
      }

      #edit-status {
        font-size: 10px;
        margin-left: auto;
      }

      #editor-textarea {
        padding: 10px 12px;
        font-size: 12px;
      }

      #pdfModalContent {
        padding: 12px;
      }

      #pdfFileList {
        padding: 8px;
      }

      .pdf-file-item {
        padding: 6px;
        gap: 6px;
        font-size: 12px;
      }

      .pdf-file-item button {
        padding: 3px 6px;
        font-size: 10px;
      }

      #pdfModalButtons {
        gap: 6px;
      }

      #pdfModalButtons button {
        padding: 6px 12px;
        font-size: 11px;
      }

      table {
        font-size: 12px;
      }

      th, td {
        padding: 6px 8px;
      }

      pre {
        padding: 10px;
        font-size: 11px;
      }

      code {
        font-size: 0.85em;
      }

      #content h1, #content h2, #content h3 {
        margin-top: 1em;
        margin-bottom: 0.5em;
      }

      #content h1 {
        font-size: 1.4em;
      }

      #content h2 {
        font-size: 1.2em;
      }
    }
  </style>
  <script src="bootstrap.bundle.min.js"></script>
</head>
<body data-theme="light" class="m-0 p-0">

  <div class="wiki-container">
    <div id="sidebar">
      <div id="top-bar">
        <h2>📚 Wiki PRO</h2>
        <div id="controls">
          <button id="exportBtn" class="btn btn-info btn-sm" title="Exportar HTML">📥 HTML</button>
          <select id="pdfOrientation" class="form-select form-select-sm" title="Orientacion PDF" style="max-width: 80px;">
            <option value="portrait" selected>Vertical</option>
            <option value="landscape">Horizontal</option>
          </select>
          <button id="exportPdfBtn" class="btn btn-success btn-sm" title="Exportar PDF">🧾 PDF</button>
          <button id="toggleTheme" class="btn btn-secondary btn-sm" title="Cambiar tema">🌙</button>
        </div>
      </div>
      <button id="folderBtn">📁 Seleccionar carpeta</button>
      <input type="text" id="search" class="form-control form-control-sm" placeholder="Buscar títulos o contenido…">
      <ul id="fileList"></ul>
    </div>

    <div id="content-wrapper">
      <div id="breadcrumbs">Selecciona una carpeta para empezar</div>
      <div id="editor-container">
        <div id="editor-toolbar">
          <button id="viewBtn" class="view-btn btn btn-sm" title="Ver documento (Esc)">👁️ Ver</button>
          <button id="saveBtn" class="save-btn btn btn-sm" title="Guardar cambios (Ctrl+S)" disabled>💾 Guardar</button>
          <button id="cancelBtn" class="cancel-btn btn btn-sm" title="Descartar cambios">✕ Cancelar</button>
          <span id="edit-status"></span>
        </div>
        <textarea id="editor-textarea" placeholder="Escriba aquí..."></textarea>
      </div>
      <div id="content">
        <p>Selecciona una carpeta para empezar</p>
      </div>
    </div>
  </div>

  <div id="pdfModal">
    <div id="pdfModalContent">
      <h3>Seleccionar archivos para PDF</h3>
      <div id="pdfFileList"></div>
      <div id="pdfModalButtons">
        <button id="pdfSelectAll" class="btn btn-secondary btn-sm">Seleccionar todos</button>
        <button id="pdfCancel" class="btn btn-secondary btn-sm">Cancelar</button>
        <button id="pdfConfirm" class="btn btn-success btn-sm">Generar PDF</button>
      </div>
    </div>
  </div>

  <script>
    const folderBtn = document.getElementById('folderBtn');
    const fileList = document.getElementById('fileList');
    const content = document.getElementById('content');
    const breadcrumbs = document.getElementById('breadcrumbs');
    const searchInput = document.getElementById('search');
    const toggleThemeBtn = document.getElementById('toggleTheme');
    const exportBtn = document.getElementById('exportBtn');
    const exportPdfBtn = document.getElementById('exportPdfBtn');
    const pdfOrientationSelect = document.getElementById('pdfOrientation');
    const pdfModal = document.getElementById('pdfModal');
    const pdfFileList = document.getElementById('pdfFileList');
    const pdfSelectAll = document.getElementById('pdfSelectAll');
    const pdfCancel = document.getElementById('pdfCancel');
    const pdfConfirm = document.getElementById('pdfConfirm');
    const editorContainer = document.getElementById('editor-container');
    const editorTextarea = document.getElementById('editor-textarea');
    const viewBtn = document.getElementById('viewBtn');
    const saveBtn = document.getElementById('saveBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const editStatus = document.getElementById('edit-status');

    let pdfOrderedFiles = [];

    let files = {};     // .md
    let allFiles = {};  // todos los archivos
    let currentPath = null;
    let lastSearchTerm = '';
    let rootFolder = '';  // Carpeta raíz detectada
    let dirHandle = null; // Almacenar el directorio para guardar
    let originalContent = ''; // Contenido original para detectar cambios
    let isEditing = false; // Si está en modo edición

    // Cambiar tema
    toggleThemeBtn.addEventListener('click', () => {
      const theme = document.body.getAttribute('data-theme');
      document.body.setAttribute('data-theme', theme === 'light' ? 'dark' : 'light');
      toggleThemeBtn.textContent = theme === 'light' ? '☀️' : '🌙';
    });

    // Detectar carpeta raíz automáticamente
    function detectRootFolder(filePaths) {
      if (filePaths.length === 0) return '';
      
      // Obtener todas las partes de ruta
      const parts = filePaths[0].split('/');
      
      // Encontrar la carpeta común más profunda
      for (let i = parts.length - 1; i >= 0; i--) {
        const potentialRoot = parts[i];
        if (potentialRoot && potentialRoot !== '.' && !potentialRoot.includes('.')) {
          return potentialRoot + '/';
        }
      }
      
      return '';
    }

    // Exportar HTML
    exportBtn.addEventListener('click', async () => {
      if (Object.keys(files).length === 0) {
        alert('Carga una carpeta primero');
        return;
      }

      exportBtn.disabled = true;
      exportBtn.textContent = '⏳ Exportando...';

      try {
        // Intentar usar File System Access API
        if ('showDirectoryPicker' in window) {
          const dirHandle = await window.showDirectoryPicker();
          let count = 0;

          // Procesar todos los archivos .md
          for (const path in files) {
            const mdFile = files[path];
            const relativePath = path.replace(new RegExp(`^.*?${rootFolder.replace(/\//g, '\\/')}`), '');
            const htmlPath = relativePath.replace(/\.md$/, '.html');

            const reader = new FileReader();
            const markdownContent = await new Promise((resolve) => {
              reader.onload = () => resolve(reader.result);
              reader.readAsText(mdFile);
            });

            // Convertir markdown a HTML
            let htmlContent = marked.parse(markdownContent);
            
            // Actualizar enlaces .md a .html
            htmlContent = htmlContent.replace(/href="([^"]+)\.md"/g, 'href="$1.html"');
            htmlContent = htmlContent.replace(/href="\.\.?\/([^"]+)\.md"/g, (match, p1) => {
              return `href="${p1}.html"`;
            });

            const fullHtml = `<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${relativePath.replace('.md', '')}</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
      color: #333;
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }
    pre {
      background: #f4f4f4;
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
      border-left: 3px solid #1a73e8;
    }
    code {
      background: #f4f4f4;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
    }
    pre code {
      background: none;
      padding: 0;
    }
    a {
      color: #1a73e8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    h1, h2, h3 {
      margin-top: 1.5em;
      color: #202124;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background: #f4f4f4;
    }
  </style>
</head>
<body>
${htmlContent}
</body>
</html>`;

            // Crear subdirectorios si es necesario
            const parts = htmlPath.split('/');
            let currentDir = dirHandle;
            for (let i = 0; i < parts.length - 1; i++) {
              currentDir = await currentDir.getDirectoryHandle(parts[i], { create: true });
            }

            const fileHandle = await currentDir.getFileHandle(parts[parts.length - 1], { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(fullHtml);
            await writable.close();
            count++;
          }

          // Incluir imágenes y otros recursos
          for (const path in allFiles) {
            const file = allFiles[path];
            if (!path.endsWith('.md')) {
              const relativePath = path.replace(new RegExp(`^.*?${rootFolder.replace(/\//g, '\\/')}`), '');
              const parts = relativePath.split('/');
              let currentDir = dirHandle;
              for (let i = 0; i < parts.length - 1; i++) {
                currentDir = await currentDir.getDirectoryHandle(parts[i], { create: true });
              }

              const fileHandle = await currentDir.getFileHandle(parts[parts.length - 1], { create: true });
              const writable = await fileHandle.createWritable();
              await writable.write(file);
              await writable.close();
            }
          }

          alert(`✅ Exportación completa: ${count} documentos HTML guardados en la carpeta seleccionada`);
        } else {
          alert('❌ Tu navegador no soporta la exportación de carpetas. Usa Chrome o Edge.');
        }
      } catch (error) {
        if (error.name === 'AbortError') {
          // Usuario canceló
        } else {
          alert('Error al exportar: ' + error.message);
        }
      } finally {
        exportBtn.disabled = false;
        exportBtn.textContent = '📥 HTML';
      }
    });

    // Mostrar modal de selección de archivos
    exportPdfBtn.addEventListener('click', () => {
      if (Object.keys(files).length === 0) {
        alert('Carga una carpeta primero');
        return;
      }

      showPdfModal();
    });

    function showPdfModal() {
      pdfOrderedFiles = Object.keys(files).sort();
      renderPdfFileList();
      pdfModal.classList.add('show');
    }

    function renderPdfFileList() {
      pdfFileList.innerHTML = '';
      pdfOrderedFiles.forEach((path, index) => {
        const div = document.createElement('div');
        div.className = 'pdf-file-item';
        div.innerHTML = `
          <input type="checkbox" checked data-path="${path}">
          <span>${path.replace(new RegExp(`^.*?${rootFolder.replace(/\//g, '\\/')}`), '')}</span>
          <button onclick="movePdfFile(${index}, -1)" ${index === 0 ? 'disabled' : ''}>↑</button>
          <button onclick="movePdfFile(${index}, 1)" ${index === pdfOrderedFiles.length - 1 ? 'disabled' : ''}>↓</button>
        `;
        pdfFileList.appendChild(div);
      });
    }

    window.movePdfFile = function(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= pdfOrderedFiles.length) return;
      [pdfOrderedFiles[index], pdfOrderedFiles[newIndex]] = [pdfOrderedFiles[newIndex], pdfOrderedFiles[index]];
      renderPdfFileList();
    };

    pdfSelectAll.addEventListener('click', () => {
      const checkboxes = pdfFileList.querySelectorAll('input[type="checkbox"]');
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);
      checkboxes.forEach(cb => cb.checked = !allChecked);
      pdfSelectAll.textContent = allChecked ? 'Seleccionar todos' : 'Deseleccionar todos';
    });

    pdfCancel.addEventListener('click', () => {
      pdfModal.classList.remove('show');
    });

    pdfConfirm.addEventListener('click', async () => {
      pdfModal.classList.remove('show');
      await generatePdf();
    });

    // Exportar PDF (documentos seleccionados)
    async function generatePdf() {
      exportPdfBtn.disabled = true;
      exportPdfBtn.textContent = '⏳ PDF...';

      try {
        const orientation = pdfOrientationSelect.value || 'portrait';
        const selectedPaths = Array.from(pdfFileList.querySelectorAll('input[type="checkbox"]:checked'))
          .map(cb => cb.getAttribute('data-path'));
        
        if (selectedPaths.length === 0) {
          alert('Selecciona al menos un documento');
          exportPdfBtn.disabled = false;
          exportPdfBtn.textContent = '🧾PDF';
          return;
        }

        const sections = [];

        function readFileAsText(file) {
          return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.readAsText(file);
          });
        }

        for (const path of selectedPaths) {
          const markdownContent = await readFileAsText(files[path]);
          let htmlContent = marked.parse(markdownContent);
          
          // Convertir imágenes a data URIs
          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlContent, 'text/html');
          
          const imgPromises = Array.from(doc.querySelectorAll('img')).map(async img => {
            const src = img.getAttribute('src');
            if (!src || src.startsWith('http') || src.startsWith('data:')) return;
            const resolved = resolvePath(path, src);
            const file = allFiles[resolved];
            if (file) {
              // Para SVGs, insertarlos inline en lugar de como <img>
              if (file.type === 'image/svg+xml' || file.name.endsWith('.svg')) {
                try {
                  const svgText = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.readAsText(file);
                  });
                  
                  // Crear un elemento temporal para parsear el SVG
                  const tempDiv = document.createElement('div');
                  tempDiv.innerHTML = svgText.trim();
                  const svgElement = tempDiv.querySelector('svg');
                  
                  if (svgElement) {
                    // Asegurar que el SVG tenga dimensiones
                    if (!svgElement.hasAttribute('width')) svgElement.setAttribute('width', '100%');
                    if (!svgElement.hasAttribute('height')) svgElement.setAttribute('height', 'auto');
                    svgElement.style.maxWidth = '100%';
                    svgElement.style.height = 'auto';
                    
                    // Reemplazar el <img> con el <svg> inline
                    img.parentNode.replaceChild(svgElement, img);
                  }
                } catch (e) {
                  console.error('Error procesando SVG:', e);
                }
              } else {
                // Para otras imágenes, usar data URI normal
                const dataUrl = await new Promise((resolve) => {
                  const reader = new FileReader();
                  reader.onload = () => resolve(reader.result);
                  reader.readAsDataURL(file);
                });
                img.setAttribute('src', dataUrl);
              }
            }
          });
          
          await Promise.all(imgPromises);
          
          htmlContent = doc.body.innerHTML;
          sections.push(`<article>
${htmlContent}
</article>`);
        }

        const printWindow = window.open('', '_blank');
        if (!printWindow) {
          alert('Tu navegador bloqueó la ventana de impresión');
          return;
        }

        printWindow.document.open();
        printWindow.document.write(`<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki PDF</title>
  <style>
    @page {
      size: A4 ${orientation};
      margin: 15mm 15mm 12mm 15mm;
    }
    @page {
      @bottom-center {
        content: counter(page) " / " counter(pages);
        font-size: 10pt;
        color: #666;
      }
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 100%;
      margin: 0;
      padding: 8mm 8mm 8mm 8mm;
      line-height: 1.6;
      color: #333;
      font-size: 11pt;
    }
    article {
      page-break-before: always;
    }
    article:first-of-type {
      page-break-before: auto;
    }
    img, svg {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      display: block;
    }
    img[src$=".svg"], img[src*="svg"], svg {
      width: 100%;
      height: auto;
    }
    pre {
      background: #f4f4f4;
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
      border-left: 3px solid #1a73e8;
      page-break-inside: avoid;
    }
    code {
      background: #f4f4f4;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
    }
    pre code {
      background: none;
      padding: 0;
    }
    a {
      color: #1a73e8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    h1, h2, h3 {
      margin-top: 1.5em;
      color: #202124;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
      table-layout: fixed;
      word-wrap: break-word;
      border: 1px solid #ddd;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 6px 8px;
      text-align: left;
      word-wrap: break-word;
      overflow-wrap: break-word;
      hyphens: auto;
      font-size: 10pt;
    }
    th {
      background: #f4f4f4;
      font-weight: bold;
      border-bottom: 2px solid #999;
    }
    tr {
      border-bottom: 1px solid #ddd;
    }
    tbody tr:last-child td {
      border-bottom: 1px solid #ddd;
    }
    @media print {
      body {
        max-width: none;
      }
      a {
        color: #000;
        text-decoration: none;
      }
      img, svg {
        max-width: 100%;
        page-break-inside: avoid;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      table {
        page-break-inside: avoid;
        font-size: 9pt;
        border: 1px solid #ddd;
      }
      tr {
        page-break-inside: avoid;
      }
      thead {
        display: table-header-group;
      }
      tfoot {
        display: table-footer-group;
      }
      th, td {
        padding: 4px 6px;
        border: 1px solid #ddd;
      }
    }
  </style>
</head>
<body>
  ${sections.join('\n')}
</body>
</html>`);
        printWindow.document.close();
        printWindow.focus();
        printWindow.print();
      } catch (error) {
        alert('Error al exportar PDF: ' + error.message);
      } finally {
        exportPdfBtn.disabled = false;
        exportPdfBtn.textContent = '🧾 PDF';
      }
    }

    folderBtn.addEventListener('click', async () => {
      if (!('showDirectoryPicker' in window)) {
        alert('Tu navegador no soporta esta función. Usa Chrome o Edge.');
        return;
      }

      try {
        dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        
        files = {};
        allFiles = {};
        fileList.innerHTML = '';
        searchInput.value = '';
        content.innerHTML = '<p>Cargando archivos…</p>';
        breadcrumbs.textContent = '';

        // Leer todos los archivos recursivamente
        await readDirectory(dirHandle, '');

        rootFolder = dirHandle.name + '/';

        // Mostrar archivos en la lista
        for (const path in files) {
          const li = document.createElement('li');
          li.textContent = path;
          li.onclick = () => openFile(path, li);
          fileList.appendChild(li);
        }

        // Abrir README.md por defecto
        const readme = Object.keys(files).find(p => p.endsWith('README.md'));
        if (readme) openFile(readme);
        else content.innerHTML = '<p>Selecciona un documento de la lista</p>';
      } catch (e) {
        if (e.name !== 'AbortError') {
          console.error('Error al cargar carpeta:', e);
        }
      }
    });

    async function readDirectory(dirHandle, path) {
      for await (const entry of dirHandle.values()) {
        const entryPath = path ? `${path}/${entry.name}` : entry.name;
        
        if (entry.kind === 'file') {
          const file = await entry.getFile();
          allFiles[entryPath] = file;
          if (file.name.endsWith('.md')) {
            files[entryPath] = file;
          }
        } else if (entry.kind === 'directory') {
          await readDirectory(entry, entryPath);
        }
      }
    }

    function openFile(path, li = null) {
      // Si hay cambios sin guardar, preguntar
      if (isEditing && originalContent !== editorTextarea.value) {
        if (!confirm('Hay cambios sin guardar. ¿Descartar?')) {
          return;
        }
      }

      currentPath = path;
      document.querySelectorAll('#fileList li').forEach(el => el.classList.remove('active'));
      if (li) li.classList.add('active');

      const reader = new FileReader();
      reader.onload = () => {
        originalContent = reader.result;
        editorTextarea.value = originalContent;
        content.innerHTML = marked.parse(originalContent);
        wireLinks();
        wireImages();
        wireBreadcrumbs();
        exitEditMode();
        updateEditStatus();
        
        // Resaltar término de búsqueda en el contenido
        if (lastSearchTerm) {
          highlightInContent(lastSearchTerm);
        }
      };
      reader.readAsText(files[path]);
    }

    function enterEditMode() {
      isEditing = true;
      editorContainer.classList.add('active');
      content.classList.add('edit-mode');
      editorTextarea.focus();
      updateEditStatus();
    }

    function exitEditMode() {
      isEditing = false;
      editorContainer.classList.remove('active');
      content.classList.remove('edit-mode');
      updateEditStatus();
    }

    function updateEditStatus() {
      if (!isEditing) {
        editStatus.textContent = '';
        return;
      }
      const hasChanges = editorTextarea.value !== originalContent;
      editStatus.textContent = hasChanges ? '● Cambios sin guardar' : '✔ Guardado';
      editStatus.style.color = hasChanges ? '#ff6b6b' : '#34a853';
      saveBtn.disabled = !hasChanges;
    }

    async function saveFile() {
      if (!currentPath) {
        alert('Por favor, abre un documento primero');
        return;
      }
      
      if (!dirHandle) {
        alert('No hay permisos de escritura. Recarga la carpeta.');
        return;
      }
      
      saveBtn.disabled = true;
      saveBtn.textContent = '💾 Guardando...';

      try {
        const mdContent = editorTextarea.value;
        const parts = currentPath.split('/');

        // Navegar a través de los subdirectorios
        let currentDir = dirHandle;
        for (let i = 0; i < parts.length - 1; i++) {
          currentDir = await currentDir.getDirectoryHandle(parts[i]);
        }

        // Guardar el archivo
        const fileName = parts[parts.length - 1];
        const fileHandle = await currentDir.getFileHandle(fileName);
        const writable = await fileHandle.createWritable();
        await writable.write(mdContent);
        await writable.close();

        // Actualizar en memoria
        originalContent = mdContent;
        files[currentPath] = new File([mdContent], fileName, { type: 'text/markdown' });
        
        updateEditStatus();
        // Actualizar la visualización
        content.innerHTML = marked.parse(mdContent);
        wireLinks();
        wireImages();
        
        editStatus.textContent = '✔ Guardado';
        editStatus.style.color = '#34a853';
        setTimeout(() => {
          updateEditStatus();
        }, 1500);
      } catch (error) {
        console.error('Error al guardar:', error);
        alert('Error al guardar: ' + error.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '💾 Guardar';
      }
    }

    // Event listeners para edición
    document.addEventListener('keydown', (e) => {
      if (isEditing && e.ctrlKey && e.key === 's') {
        e.preventDefault();
        saveFile();
      }
      if (isEditing && e.key === 'Escape') {
        e.preventDefault();
        if (editorTextarea.value !== originalContent) {
          if (confirm('Descartar cambios?')) {
            exitEditMode();
          }
        } else {
          exitEditMode();
        }
      }
    });

    editorTextarea.addEventListener('input', updateEditStatus);

    viewBtn.addEventListener('click', () => {
      if (isEditing) {
        if (editorTextarea.value !== originalContent) {
          if (!confirm('Descartar cambios?')) return;
        }
        exitEditMode();
      }
    });

    saveBtn.addEventListener('click', saveFile);

    cancelBtn.addEventListener('click', () => {
      if (editorTextarea.value !== originalContent) {
        if (!confirm('Descartar cambios?')) return;
      }
      exitEditMode();
    });

    // Agregar botón de editar al hacer clic derecho o mediante un button
    content.addEventListener('dblclick', () => {
      if (currentPath && currentPath.endsWith('.md')) {
        enterEditMode();
      }
    });

    // Agregar botón de editar a la interfaz principal
    const editBtnHeader = document.createElement('button');
    editBtnHeader.id = 'editBtnHeader';
    editBtnHeader.className = 'edit-btn';
    editBtnHeader.title = 'Editar documento actual';
    editBtnHeader.textContent = '✏️ Editar';
    editBtnHeader.style.display = 'none';
    editBtnHeader.addEventListener('click', enterEditMode);
    
    // Insertarlo después del botón de tema
    toggleThemeBtn.parentNode.insertBefore(editBtnHeader, toggleThemeBtn.nextSibling);

    // Breadcrumbs
    function wireBreadcrumbs() {
      const parts = currentPath.split('/');
      let crumbs = [];
      for (let i = 0; i < parts.length; i++) {
        const name = parts[i];
        const subpath = parts.slice(0, i + 1).join('/');
        crumbs.push(`<a href="#" data-path="${subpath}">${name}</a>`);
      }
      breadcrumbs.innerHTML = crumbs.join(' / ');
      breadcrumbs.querySelectorAll('a').forEach(a => {
        a.onclick = e => {
          e.preventDefault();
          const path = a.getAttribute('data-path');
          if (files[path]) openFile(path);
        };
      });
    }

    // Enlaces internos .md
    function wireLinks() {
      content.querySelectorAll('a').forEach(link => {
        const href = link.getAttribute('href');
        if (!href || href.startsWith('http')) return;
        link.onclick = e => {
          e.preventDefault();
          const resolved = resolvePath(currentPath, href);
          if (files[resolved]) openFile(resolved);
          else alert('Página no encontrada: ' + href);
        };
      });
    }

    // Imágenes locales
    function wireImages() {
      content.querySelectorAll('img').forEach(img => {
        const src = img.getAttribute('src');
        if (!src || src.startsWith('http')) return;
        const resolved = resolvePath(currentPath, src);
        const file = allFiles[resolved];
        if (file) {
          img.src = URL.createObjectURL(file);
          img.onclick = () => img.classList.toggle('zoomed');
        } else {
          img.alt += ' (imagen no encontrada)';
        }
      });
    }

    // Resolver rutas relativas ./ ../
    function resolvePath(base, relative) {
      const stack = base.split('/').slice(0, -1);
      for (const part of relative.split('/')) {
        if (part === '.' || part === '') continue;
        if (part === '..') stack.pop();
        else stack.push(part);
      }
      return stack.join('/');
    }

    // Buscador de contenido
    let searchTimeout;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      const term = searchInput.value.trim();
      
      if (!term) {
        // Sin búsqueda: mostrar lista normal
        fileList.innerHTML = '';
        for (const path in files) {
          const li = document.createElement('li');
          li.textContent = path;
          li.onclick = () => openFile(path, li);
          fileList.appendChild(li);
        }
        return;
      }

      searchTimeout = setTimeout(() => {
        searchContent(term);
      }, 300);
    });

    function searchContent(term) {
      const termLower = term.toLowerCase();
      const results = [];
      
      Object.keys(files).forEach(path => {
        const reader = new FileReader();
        reader.onload = () => {
          const content = reader.result.toLowerCase();
          const fileName = path;
          
          if (fileName.toLowerCase().includes(termLower) || content.includes(termLower)) {
            // Extraer contexto
            const index = content.indexOf(termLower);
            let snippet = '';
            if (index !== -1) {
              const start = Math.max(0, index - 40);
              const end = Math.min(content.length, index + termLower.length + 40);
              snippet = '...' + reader.result.substring(start, end).replace(/\n/g, ' ') + '...';
            }
            
            results.push({ path, fileName, snippet });
          }
          
          // Actualizar después de leer todos los archivos
          if (results.length > 0 || Object.keys(files).every(p => {
            const f = files[p];
            return f._searched;
          })) {
            displaySearchResults(results, termLower);
          }
        };
        reader.readAsText(files[path]);
        files[path]._searched = true;
      });
    }

    function displaySearchResults(results, term) {
      fileList.innerHTML = '';
      lastSearchTerm = term;
      
      if (results.length === 0) {
        fileList.innerHTML = '<li style="color: #888; cursor: default;">No se encontraron resultados</li>';
        return;
      }
      
      results.forEach(({ path, fileName, snippet }) => {
        const li = document.createElement('li');
        const highlightedFileName = highlightText(fileName, term);
        li.innerHTML = `<strong>${highlightedFileName}</strong>`;
        if (snippet) {
          const highlightedSnippet = highlightText(snippet, term);
          li.innerHTML += `<br><small style="color: #aaa;">${highlightedSnippet}</small>`;
        }
        li.onclick = () => openFile(path, li);
        li.style.whiteSpace = 'normal';
        li.style.wordWrap = 'break-word';
        fileList.appendChild(li);
      });
      
      // Limpiar marcador de búsqueda
      Object.keys(files).forEach(p => delete files[p]._searched);
    }

    function highlightText(text, term) {
      const regex = new RegExp(`(${term})`, 'gi');
      return text.replace(regex, '<span class="highlight">$1</span>');
    }

    function highlightInContent(term) {
      const walker = document.createTreeWalker(
        content,
        NodeFilter.SHOW_TEXT,
        null,
        false
      );
      
      const nodesToReplace = [];
      let node;
      
      while (node = walker.nextNode()) {
        if (node.nodeValue.toLowerCase().includes(term.toLowerCase())) {
          nodesToReplace.push(node);
        }
      }
      
      nodesToReplace.forEach(node => {
        const span = document.createElement('span');
        span.innerHTML = highlightText(node.nodeValue, term);
        node.parentNode.replaceChild(span, node);
      });
    }

  </script>
</body>
</html>
