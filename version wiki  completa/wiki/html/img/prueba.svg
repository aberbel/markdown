<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 920" width="1376" height="920">
  <!-- Fondo -->
  <rect width="1376" height="920" fill="#f5f1eb"/>
  
  <!-- Título principal -->
  <text x="688" y="65" font-size="56" font-weight="bold" text-anchor="middle" fill="#003d5c" font-family="Arial, Helvetica, sans-serif">Lógica de las Golondrinas: Energía y Comportamiento</text>
  
  <!-- ========== SECCIÓN SUPERIOR: ENERGÍA INICIAL ========== -->
  <g id="energia-inicial">
    <!-- Golondrina (más realista) -->
    <g transform="translate(520, 135)">
      <!-- Cuerpo principal -->
      <ellipse cx="0" cy="5" rx="18" ry="22" fill="#1e5a7a"/>
      <!-- Cabeza -->
      <circle cx="0" cy="-20" r="14" fill="#1e5a7a"/>
      <!-- Ojo rojo -->
      <circle cx="7" cy="-23" r="4" fill="#d64545"/>
      <!-- Pico -->
      <path d="M 12,-20 L 24,-20 L 14,-16 Z" fill="#d64545"/>
      <!-- Ala izquierda (alargada) -->
      <path d="M -10,-8 Q -35,-18 -40,0" stroke="#0d3a52" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- Ala derecha (visible) -->
      <path d="M 8,-6 Q 28,-15 32,2" stroke="#0d3a52" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- Cola -->
      <path d="M -5,25 L -12,40 M 0,26 L 2,42 M 5,25 L 10,40" stroke="#0d3a52" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>
    
    <!-- Caja turquesa con energía inicial -->
    <rect x="630" y="105" width="320" height="115" rx="20" fill="#6fd3c0" stroke="#2b8a8a" stroke-width="0"/>
    
    <!-- Texto en la caja -->
    <text x="790" y="145" font-size="44" font-weight="bold" fill="#000" font-family="Arial, sans-serif" text-anchor="middle">45 JOULES</text>
    <text x="790" y="190" font-size="36" font-weight="bold" fill="#000" font-family="Arial, sans-serif" text-anchor="middle">AL NACER</text>
    <text x="790" y="213" font-size="13" fill="#003d5c" font-family="Arial, sans-serif" text-anchor="middle">Toda golondrina comienza su vida</text>
    <text x="790" y="230" font-size="13" fill="#003d5c" font-family="Arial, sans-serif" text-anchor="middle">con este nivel base de energía.</text>
  </g>
  
  <!-- ========== SECCIÓN MEDIA ========== -->
  
  <!-- IZQUIERDA: GASTO POR VUELO -->
  <g id="gasto-vuelo">
    <rect x="50" y="280" width="420" height="200" rx="25" fill="#ff9974" stroke="#ff6b4a" stroke-width="0"/>
    
    <!-- Golondrina izquierda en vuelo -->
    <g transform="translate(130, 360)">
      <!-- Cuerpo -->
      <ellipse cx="0" cy="3" rx="16" ry="20" fill="#1e5a7a"/>
      <!-- Cabeza -->
      <circle cx="0" cy="-18" r="12" fill="#1e5a7a"/>
      <!-- Ojo -->
      <circle cx="6" cy="-21" r="3" fill="#d64545"/>
      <!-- Pico -->
      <path d="M 10,-18 L 20,-18 L 12,-15 Z" fill="#d64545"/>
      <!-- Alas -->
      <path d="M -8,-6 Q -28,-14 -34,-2" stroke="#0d3a52" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 6,-5 Q 22,-12 28,0" stroke="#0d3a52" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Cola -->
      <path d="M -4,22 L -9,35 M 0,23 L 1,36" stroke="#0d3a52" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>
    
    <!-- Contenido de texto -->
    <text x="280" y="305" font-size="20" font-weight="bold" fill="#000" font-family="Arial, sans-serif">GASTO POR VUELO</text>
    
    <text x="280" y="340" font-size="28" font-weight="bold" fill="#000" font-family="Arial, sans-serif">CONSUME</text>
    <text x="280" y="377" font-size="40" font-weight="bold" fill="#000" font-family="Arial, sans-serif">10J</text>
    <text x="280" y="405" font-size="13" fill="#000" font-family="Arial, sans-serif">ERBIOS POR</text>
    <text x="280" y="425" font-size="13" fill="#000" font-family="Arial, sans-serif">DESPEGAR</text>
    
    <!-- Símbolo + -->
    <text x="340" y="380" font-size="40" font-weight="bold" fill="#000" font-family="Arial, sans-serif">+</text>
    
    <!-- Parte derecha: 1J por km -->
    <text x="370" y="340" font-size="28" font-weight="bold" fill="#000" font-family="Arial, sans-serif">1J</text>
    <text x="365" y="308" font-size="11" fill="#000" font-family="Arial, sans-serif">km</text>
    <text x="375" y="370" font-size="11" fill="#000" font-family="Arial, sans-serif">POR CADA</text>
    <text x="367" y="388" font-size="11" fill="#000" font-family="Arial, sans-serif">KILÓMETRO</text>
    <text x="373" y="406" font-size="11" fill="#000" font-family="Arial, sans-serif">RECORRIDO</text>
    
    <!-- Icono batería -->
    <rect x="310" y="435" width="22" height="40" rx="2" fill="none" stroke="#d64545" stroke-width="2"/>
    <rect x="310" y="435" width="22" height="15" fill="#d64545"/>
    <rect x="318" y="430" width="6" height="5" fill="#d64545"/>
    
    <!-- Rayo -->
    <text x="345" y="460" font-size="24" fill="#d64545" font-family="Arial, sans-serif">⚡</text>
  </g>
  
  <!-- DERECHA: RECARGA POR ALIMENTACIÓN -->
  <g id="recarga-alimentacion">
    <rect x="536" y="280" width="420" height="200" rx="25" fill="#f4d96b" stroke="#d4a530" stroke-width="0"/>
    
    <!-- Golondrina devorando -->
    <g transform="translate(610, 360)">
      <ellipse cx="0" cy="3" rx="16" ry="20" fill="#1e5a7a"/>
      <circle cx="0" cy="-18" r="12" fill="#1e5a7a"/>
      <circle cx="6" cy="-21" r="3" fill="#d64545"/>
      <path d="M 10,-18 L 20,-18 L 12,-15 Z" fill="#d64545"/>
      <!-- Boca abierta para mosquito -->
      <ellipse cx="16" cy="-16" rx="5" ry="4" fill="#000" opacity="0.3"/>
      <!-- Alas -->
      <path d="M -8,-6 Q -28,-14 -34,-2" stroke="#0d3a52" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 6,-5 Q 22,-12 28,0" stroke="#0d3a52" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Cola -->
      <path d="M -4,22 L -9,35 M 0,23 L 1,36" stroke="#0d3a52" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>
    
    <!-- Mosquitos -->
    <g transform="translate(700, 325)">
      <!-- Mosquito 1 -->
      <ellipse cx="0" cy="0" rx="5" ry="7" fill="#333"/>
      <line x1="-8" y1="-2" x2="-13" y2="-6" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="8" y1="-2" x2="13" y2="-6" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-8" y1="2" x2="-13" y2="6" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="8" y1="2" x2="13" y2="6" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
    <g transform="translate(740, 330)">
      <!-- Mosquito 2 -->
      <ellipse cx="0" cy="0" rx="5" ry="7" fill="#333"/>
      <line x1="-8" y1="-2" x2="-13" y2="-6" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="8" y1="-2" x2="13" y2="-6" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-8" y1="2" x2="-13" y2="6" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="8" y1="2" x2="13" y2="6" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
    <!-- Contenido de texto -->
    <text x="820" y="305" font-size="20" font-weight="bold" fill="#000" font-family="Arial, sans-serif">RECARGA POR ALIMENTACIÓN</text>
    
    <text x="820" y="350" font-size="28" font-weight="bold" fill="#000" font-family="Arial, sans-serif">RECUPERA</text>
    <text x="865" y="390" font-size="40" font-weight="bold" fill="#000" font-family="Arial, sans-serif">5J</text>
    <text x="820" y="420" font-size="12" fill="#000" font-family="Arial, sans-serif">DE ENERGÍA POR CADA</text>
    <text x="820" y="438" font-size="12" fill="#000" font-family="Arial, sans-serif">GRAMO QUE INGIERE</text>
    
    <!-- Icono plato (escala/peso) -->
    <circle cx="855" cy="460" r="12" fill="none" stroke="#c4924a" stroke-width="2"/>
    <line x1="843" y1="460" x2="867" y2="460" stroke="#c4924a" stroke-width="2"/>
    
    <!-- Rayo -->
    <text x="880" y="455" font-size="20" fill="#f4a500" font-family="Arial, sans-serif">⚡</text>
  </g>
  
  <!-- INFERIOR DERECHA: más espacio -->
  <g id="mas-cajas">
    <rect x="1022" y="280" width="304" height="200" rx="25" fill="#e8e8e8" stroke="#ccc" stroke-width="0"/>
    <text x="1174" y="380" font-size="16" font-weight="bold" fill="#999" font-family="Arial, sans-serif" text-anchor="middle">(Espacio adicional)</text>
  </g>
  
  <!-- ========== SECCIÓN INFERIOR: ESTADOS Y DESEOS ========== -->
  <text x="688" y="570" font-size="36" font-weight="bold" text-anchor="middle" fill="#000" font-family="Arial, sans-serif">ESTADOS Y DESEOS</text>
  
  <!-- ESTADO DÉBIL -->
  <g id="estado-debil">
    <rect x="50" y="620" width="320" height="240" rx="20" fill="#ff9999" stroke="#ff6b6b" stroke-width="0"/>
    
    <!-- Golondrina triste/débil -->
    <g transform="translate(130, 710)">
      <ellipse cx="0" cy="3" rx="16" ry="20" fill="#1e5a7a"/>
      <circle cx="0" cy="-18" r="12" fill="#1e5a7a"/>
      <circle cx="6" cy="-21" r="3" fill="#333"/>
      <path d="M 10,-18 L 20,-18 L 12,-15 Z" fill="#333"/>
      <!-- Expresión triste (sin alas extendidas) -->
      <path d="M -8,-6 Q -20,-10 -25,-3" stroke="#0d3a52" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M 6,-5 Q 16,-9 20,-2" stroke="#0d3a52" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    
    <!-- Nube de pensamiento con mosquito -->
    <g transform="translate(240, 650)">
      <!-- Nube principal -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#333" stroke-width="2"/>
      <!-- Nubes pequeñas -->
      <circle cx="-20" cy="22" r="10" fill="none" stroke="#333" stroke-width="2"/>
      <circle cx="-35" cy="32" r="7" fill="none" stroke="#333" stroke-width="2"/>
      <!-- Mosquito dentro -->
      <ellipse cx="0" cy="0" rx="4" ry="6" fill="#333"/>
      <line x1="-7" y1="-1" x2="-11" y2="-5" stroke="#333" stroke-width="1"/>
      <line x1="7" y1="-1" x2="11" y2="-5" stroke="#333" stroke-width="1"/>
    </g>
    
    <!-- Texto -->
    <text x="70" y="595" font-size="22" font-weight="bold" fill="#000" font-family="Arial, sans-serif">ESTADO: DÉBIL (< 50J)</text>
    <text x="70" y="635" font-size="13" fill="#000" font-family="Arial, sans-serif">SU DESEO ES</text>
    <text x="70" y="655" font-size="13" fill="#000" font-family="Arial, sans-serif">COMER 50g PARA</text>
    <text x="70" y="675" font-size="13" fill="#000" font-family="Arial, sans-serif">RECUPERAR LA</text>
    <text x="70" y="695" font-size="13" fill="#000" font-family="Arial, sans-serif">CAPACIDAD</text>
    <text x="70" y="715" font-size="13" fill="#000" font-family="Arial, sans-serif">DE VOLAR.</text>
  </g>
  
  <!-- ESTADO NEUTRO -->
  <g id="estado-neutro">
    <rect x="436" y="620" width="320" height="240" rx="20" fill="#a0d4d8" stroke="#5a9fa5" stroke-width="0"/>
    
    <!-- Golondrina neutral -->
    <g transform="translate(516, 710)">
      <ellipse cx="0" cy="3" rx="16" ry="20" fill="#1e5a7a"/>
      <circle cx="0" cy="-18" r="12" fill="#1e5a7a"/>
      <circle cx="6" cy="-21" r="3" fill="#333"/>
      <path d="M 10,-18 L 20,-18 L 12,-15 Z" fill="#333"/>
      <!-- Alas neutrales -->
      <path d="M -8,-6 Q -24,-12 -30,-4" stroke="#0d3a52" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 6,-5 Q 20,-11 26,-3" stroke="#0d3a52" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Cola -->
      <path d="M -4,22 L -9,35 M 0,23 L 1,36" stroke="#0d3a52" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>
    
    <!-- Texto -->
    <text x="456" y="595" font-size="22" font-weight="bold" fill="#000" font-family="Arial, sans-serif">ESTADO: NEUTRO</text>
  </g>
  
  <!-- ESTADO EUFÓRICA -->
  <g id="estado-euforia">
    <rect x="822" y="620" width="320" height="240" rx="20" fill="#f4d96b" stroke="#d4a530" stroke-width="0"/>
    
    <!-- Golondrina volando feliz -->
    <g transform="translate(902, 700)">
      <ellipse cx="0" cy="3" rx="16" ry="20" fill="#1e5a7a"/>
      <circle cx="0" cy="-18" r="12" fill="#1e5a7a"/>
      <circle cx="6" cy="-21" r="3" fill="#333"/>
      <path d="M 10,-18 L 20,-18 L 12,-15 Z" fill="#333"/>
      <!-- Alas extendidas en vuelo -->
      <path d="M -8,-6 Q -38,-18 -42,5" stroke="#0d3a52" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M 6,-5 Q 36,-16 40,6" stroke="#0d3a52" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <!-- Cola -->
      <path d="M -4,22 L -10,40 M 0,23 L 2,42" stroke="#0d3a52" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>
    
    <!-- Nube -->
    <g transform="translate(1000, 690)">
      <ellipse cx="0" cy="0" rx="28" ry="22" fill="#e0e0e0" stroke="#bbb" stroke-width="1.5"/>
    </g>
    
    <!-- Texto -->
    <text x="842" y="595" font-size="22" font-weight="bold" fill="#000" font-family="Arial, sans-serif">ESTADO: EUFÓRICA</text>
    <text x="842" y="615" font-size="18" font-weight="bold" fill="#000" font-family="Arial, sans-serif">(> 500J)</text>
    <text x="842" y="655" font-size="13" fill="#000" font-family="Arial, sans-serif">SU DESEO ES</text>
    <text x="842" y="675" font-size="13" fill="#000" font-family="Arial, sans-serif">REALIZAR UN</text>
    <text x="842" y="695" font-size="13" fill="#000" font-family="Arial, sans-serif">PASEO DE 5KM</text>
    <text x="842" y="715" font-size="13" fill="#000" font-family="Arial, sans-serif">Y VOLVER A</text>
    <text x="842" y="735" font-size="13" fill="#000" font-family="Arial, sans-serif">SU ORIGEN.</text>
  </g>
  
  <!-- Logo NotebookLM -->
  <text x="1310" y="900" font-size="12" fill="#999" font-family="Arial, sans-serif" text-anchor="end">NotebookLM</text>
</svg>