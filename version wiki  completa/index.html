<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Wiki Portátil</title>
  <script src="marked.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      height: 100vh;
      display: flex;
      background: #f6f7f9;
    }

    #sidebar {
      width: 300px;
      background: #202124;
      color: #e8eaed;
      padding: 15px;
      overflow-y: auto;
    }

    #sidebar h2 {
      font-size: 16px;
      margin-top: 0;
    }

    #fileList {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 14px;
    }

    #fileList li {
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 4px;
    }

    #fileList li:hover {
      background: #333;
    }

    #fileList li.active {
      background: #555;
    }

    #content {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
      background: white;
    }

    pre {
      background: #f0f0f0;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }

    code {
      background: #eee;
      padding: 2px 4px;
      border-radius: 4px;
    }

    a {
      color: #1a73e8;
    }

    img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>📚 Wiki</h2>
    <input type="file" id="folderInput" webkitdirectory multiple>
    <ul id="fileList"></ul>
  </div>

  <div id="content">
    <p>Selecciona la carpeta <strong>wiki/</strong></p>
  </div>

  <script>
    const folderInput = document.getElementById('folderInput');
    const fileList = document.getElementById('fileList');
    const content = document.getElementById('content');

    let files = {};      // solo .md
    let allFiles = {};   // todos los archivos (md, svg, png, etc)
    let currentPath = null;

    folderInput.addEventListener('change', () => {
      files = {};
      allFiles = {};
      fileList.innerHTML = '';

      Array.from(folderInput.files).forEach(file => {
        allFiles[file.webkitRelativePath] = file;

        if (file.name.endsWith('.md')) {
          files[file.webkitRelativePath] = file;

          const li = document.createElement('li');
          li.textContent = file.webkitRelativePath.replace(/^.*?wiki\//, '');
          li.onclick = () => openFile(file.webkitRelativePath, li);
          fileList.appendChild(li);
        }
      });

      // Abrir README.md automáticamente si existe
      const readme = Object.keys(files).find(p => p.endsWith('README.md'));
      if (readme) openFile(readme);
    });

    function openFile(path, li = null) {
      currentPath = path;

      document.querySelectorAll('#fileList li').forEach(el => el.classList.remove('active'));
      if (li) li.classList.add('active');

      const reader = new FileReader();
      reader.onload = () => {
        content.innerHTML = marked.parse(reader.result);
        wireLinks();
        wireImages();
      };
      reader.readAsText(files[path]);
    }

    // Manejar enlaces internos entre Markdown
    function wireLinks() {
      content.querySelectorAll('a').forEach(link => {
        const href = link.getAttribute('href');
        if (!href || href.startsWith('http')) return;

        link.onclick = e => {
          e.preventDefault();
          const resolved = resolvePath(currentPath, href);
          if (files[resolved]) {
            openFile(resolved);
          } else {
            alert('Página no encontrada: ' + href);
          }
        };
      });
    }

    // Manejar imágenes locales (SVG, PNG, JPG)
    function wireImages() {
      content.querySelectorAll('img').forEach(img => {
        const src = img.getAttribute('src');
        if (!src || src.startsWith('http')) return;

        const resolved = resolvePath(currentPath, src);
        const file = allFiles[resolved];
        if (file) {
          img.src = URL.createObjectURL(file);
        } else {
          img.alt += ' (imagen no encontrada)';
        }
      });
    }

    // Resolver rutas relativas tipo ./ ../
    function resolvePath(base, relative) {
      const stack = base.split('/').slice(0, -1);
      for (const part of relative.split('/')) {
        if (part === '.' || part === '') continue;
        if (part === '..') stack.pop();
        else stack.push(part);
      }
      return stack.join('/');
    }
  </script>

</body>
</html>
